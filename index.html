<title>Spelling Bee Night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one column for the host holding the phone. Black and white only; the Correct and Wrong buttons are the only color. The word is sized to fill one line. */
:root {
  --bg: #000000;
  --card: #111111;
  --raised: #1c1c1c;
  --fg: #ffffff;
  --muted: #9b9b9b;
  --line: #2c2c2c;
  --good: #1f9d55;
  --bad: #d93a2f;
  --f-display: "Young Serif", Georgia, "Times New Roman", serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--f-body);
  font-size: 17px;
  line-height: 1.55;
  padding-inline: 20px;
  padding-block: 24px 48px;
}
.wrap { max-width: 560px; margin: 0 auto; display: grid; gap: 32px; }
#app { display: grid; gap: 24px; }
h1, h2 { font-family: var(--f-display); font-weight: 400; margin: 0; line-height: 1.15; text-wrap: balance; }
p { margin: 0; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }

.mast { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
.mast h1 { font-size: 26px; }
.mast h1 em { font-style: normal; color: var(--muted); }
.link { background: none; border: 0; padding: 8px 0; color: var(--muted); font-weight: 600; font-size: 15px; cursor: pointer; text-decoration: underline; text-underline-offset: 4px; }
.link.danger { color: var(--fg); }

.label { font-size: 12.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 24px 20px; display: grid; gap: 18px; }

.btn { appearance: none; border: 0; border-radius: 14px; padding: 18px 20px; font-weight: 700; font-size: 19px; cursor: pointer; width: 100%; }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--fg); color: var(--bg); }
.btn.good { background: var(--good); color: var(--fg); }
.btn.bad { background: var(--bad); color: var(--fg); }
.btn.plain { background: transparent; border: 1.5px solid var(--line); }
.stack { display: grid; gap: 12px; }

/* Setup */
.prow { display: flex; gap: 10px; align-items: center; }
.prow input { flex: 1; min-width: 0; padding: 14px 16px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--raised); }
.prow input::placeholder { color: var(--muted); }
.prow input:focus { border-color: var(--fg); outline: none; }
.rm { width: 50px; height: 50px; flex: none; border-radius: 12px; border: 1.5px solid var(--line); background: transparent; font-size: 22px; color: var(--muted); cursor: pointer; }
.levels { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.levels button { border: 1.5px solid var(--line); background: var(--raised); border-radius: 12px; padding: 14px; text-align: left; cursor: pointer; display: grid; gap: 4px; }
.levels button b { font-size: 17px; }
.levels button span { font-size: 13.5px; color: var(--muted); }
.levels button[aria-pressed="true"] { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }
.how { font-size: 15.5px; color: var(--muted); }

/* Turn */
.who { display: flex; align-items: center; gap: 16px; }
.who > div { display: grid; gap: 4px; }
.placard { width: 56px; height: 50px; flex: none; border-radius: 8px; background: var(--fg); color: var(--bg); display: grid; place-items: center; font-weight: 700; font-size: 22px; font-variant-numeric: tabular-nums; }
.who h2 { font-size: 28px; }
.word { font-family: var(--f-display); font-size: 64px; line-height: 1.1; white-space: nowrap; overflow: hidden; padding-block: 8px; }
.facts { display: grid; gap: 18px; font-size: 16px; border-top: 1px solid var(--line); padding-top: 20px; }
.facts div { display: grid; gap: 4px; }
.facts .label { font-size: 11.5px; }
.verdict { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.verdict .btn { padding: 24px 12px; font-size: 22px; }
.banner { padding: 14px 16px; border-radius: 12px; background: var(--raised); border: 1px solid var(--line); font-weight: 600; font-size: 15.5px; }
.row-links { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; }

.players { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 8px; }
.players span { padding: 6px 14px; border-radius: 999px; border: 1.5px solid var(--line); font-size: 14.5px; font-weight: 600; }
.players span.now { border-color: var(--fg); background: var(--fg); color: var(--bg); }
.players span.missed { border-style: dashed; color: var(--muted); }
.players span.out { text-decoration: line-through; color: var(--muted); opacity: .5; }

.win { gap: 12px; }
.win h2 { font-size: clamp(36px, 10vw, 54px); }
.win h2 em { font-style: normal; }
</style>

<div class="wrap">
  <header class="mast">
    <h1>Spelling Bee <em>Night</em></h1>
    <span id="mastLink"></span>
  </header>
  <main id="app"></main>
</div>

const LEVELS = {
  beginner:     { name: "Easy",   blurb: "Kids and warm-ups" },
  intermediate: { name: "Medium", blurb: "Tricky everyday words" },
  advanced:     { name: "Hard",   blurb: "Trips up most adults" },
  championship: { name: "Expert", blurb: "National bee words" }
};

let S = { phase: "setup", names: ["", ""], level: "beginner", players: [], round: 1, order: [], pos: 0, missed: [], used: [], word: null, banner: null };
let confirmEnd = false;

const $app = document.getElementById("app");
const $mast = document.getElementById("mastLink");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

function pickWord() {
  const list = WORDS[S.level];
  let pool = list.filter(w => !S.used.includes(w[0]));
  if (!pool.length) { S.used = []; pool = list; }
  const w = pool[Math.floor(Math.random() * pool.length)];
  S.used.push(w[0]);
  return { word: w[0], pos: w[1], def: w[2], sent: w[3], origin: w[4], alts: w[5] || [] };
}

/* ---------- Setup ---------- */
function renderSetup() {
  $mast.innerHTML = "";
  $app.innerHTML = `
    <div class="card">
      <p class="how">You hold the phone and read each word out loud. Your friends spell it. Tap <b>Correct</b> or <b>Wrong</b>. One wrong answer and that speller is out. Last one standing wins.</p>
    </div>
    <div class="card">
      <span class="label">Players</span>
      <div class="stack">
      ${S.names.map((n, i) => `
        <div class="prow">
          <input id="p-${i}" data-i="${i}" value="${esc(n)}" maxlength="18" placeholder="Player ${i + 1}" aria-label="Player ${i + 1} name">
          <button class="rm" data-rm="${i}" aria-label="Remove player ${i + 1}" ${S.names.length <= 1 ? "hidden" : ""}>&times;</button>
        </div>`).join("")}
      </div>
      <button class="btn plain" id="add">+ Add player</button>
    </div>
    <div class="card">
      <span class="label">Difficulty</span>
      <div class="levels">
        ${Object.entries(LEVELS).map(([k, v]) => `<button data-lv="${k}" aria-pressed="${S.level === k}"><b>${v.name}</b><span>${v.blurb}</span></button>`).join("")}
      </div>
    </div>
    <button class="btn primary" id="start">Start</button>`;

  $app.querySelectorAll(".prow input").forEach(inp => inp.addEventListener("input", e => { S.names[+e.target.dataset.i] = e.target.value; }));
  $app.querySelectorAll("[data-rm]").forEach(b => b.addEventListener("click", () => { S.names.splice(+b.dataset.rm, 1); render(); }));
  $app.querySelectorAll("[data-lv]").forEach(b => b.addEventListener("click", () => { S.level = b.dataset.lv; render(); }));
  document.getElementById("add").addEventListener("click", () => {
    S.names.push(""); render();
    document.getElementById(`p-${S.names.length - 1}`).focus();
  });
  document.getElementById("start").addEventListener("click", startGame);
}

function startGame() {
  S.players = S.names.map((n, i) => ({ name: n.trim() || `Player ${i + 1}`, num: i + 1, out: false, right: 0 }));
  S.round = 1; S.used = []; S.banner = null;
  beginRound();
}
function beginRound() {
  S.order = S.players.map((p, i) => i).filter(i => !S.players[i].out);
  S.pos = 0; S.missed = [];
  S.word = pickWord();
  S.phase = "turn";
  render();
}

/* ---------- Turn ---------- */
function mark(correct) {
  const idx = S.order[S.pos], p = S.players[idx];
  if (correct) { p.right++; S.banner = { text: `${p.name} got it right.`, out: false }; }
  else { S.missed.push(idx); S.banner = { text: `${p.name} missed. The word was “${S.word.word}”.`, out: true }; }
  S.pos++;
  if (S.pos >= S.order.length) return endRound();
  S.word = pickWord();
  render();
}
function skip() { S.word = pickWord(); render(); }

function endRound() {
  const solo = S.players.length === 1;
  if (!solo && S.missed.length && S.missed.length === S.order.length) {
    S.banner = { text: "Everyone missed this round, so everyone stays in.", out: false };
  } else if (S.missed.length) {
    S.missed.forEach(i => { S.players[i].out = true; });
    S.banner = { text: `Out: ${S.missed.map(i => S.players[i].name).join(", ")}.`, out: true };
  }
  const left = S.players.filter(p => !p.out).length;
  if (solo ? left === 0 : left <= 1) { S.phase = "over"; return render(); }
  S.round++;
  beginRound();
}

function renderTurn() {
  const p = S.players[S.order[S.pos]], w = S.word;
  $mast.innerHTML = `<button class="link" id="end">End game</button>`;
  $app.innerHTML = `
    ${S.banner ? `<div class="banner">${esc(S.banner.text)}</div>` : ""}
    <div class="who">
      <div class="placard" aria-hidden="true">${p.num}</div>
      <div>
        <div class="label">Round ${S.round} · ${LEVELS[S.level].name}</div>
        <h2>${esc(p.name)}, spell…</h2>
      </div>
    </div>
    <div class="card">
      <div class="word" id="word">${esc(w.word)}</div>
      ${w.alts.length ? `<div class="how">Also accept: ${w.alts.map(esc).join(", ")}</div>` : ""}
      <div class="facts">
        <div><span class="label">Meaning (${esc(w.pos)})</span>${esc(w.def)}</div>
        <div><span class="label">Sentence</span>${esc(w.sent)}</div>
        <div><span class="label">Origin</span>${esc(w.origin)}</div>
      </div>
    </div>
    <div class="verdict">
      <button class="btn good" id="yes">Correct</button>
      <button class="btn bad" id="no">Wrong</button>
    </div>
    <div class="row-links">
      <button class="link" id="skip">Skip this word</button>
    </div>
    ${playersHTML(S.order[S.pos])}`;

  fitWord();
  document.getElementById("yes").addEventListener("click", () => mark(true));
  document.getElementById("no").addEventListener("click", () => mark(false));
  document.getElementById("skip").addEventListener("click", skip);
  const end = document.getElementById("end");
  end.addEventListener("click", () => {
    if (!confirmEnd) { confirmEnd = true; end.textContent = "Tap again to end"; end.classList.add("danger"); return; }
    S.phase = "setup"; render();
  });
}

/* Shrink the word until it fits on one line, up to 64px. */
function fitWord() {
  const el = document.getElementById("word");
  if (!el) return;
  let size = 64;
  el.style.fontSize = size + "px";
  const room = el.clientWidth;
  if (el.scrollWidth > room) size = Math.floor(size * room / el.scrollWidth);
  el.style.fontSize = size + "px";
  while (el.scrollWidth > el.clientWidth && size > 10) el.style.fontSize = --size + "px";
}
window.addEventListener("resize", fitWord);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitWord);

function playersHTML(nowIdx) {
  return `<div class="players" aria-label="Players">${S.players.map((p, i) => {
    const cls = p.out ? "out" : i === nowIdx ? "now" : S.missed.includes(i) ? "missed" : "";
    return `<span class="${cls}">${esc(p.name)}</span>`;
  }).join("")}</div>`;
}

/* ---------- Game over ---------- */
function renderOver() {
  $mast.innerHTML = "";
  const solo = S.players.length === 1;
  const champ = S.players.find(p => !p.out);
  const head = solo
    ? `<em>${S.players[0].right}</em> word${S.players[0].right === 1 ? "" : "s"} in a row`
    : champ ? `<em>${esc(champ.name)}</em> wins!` : "Nobody's left!";
  $app.innerHTML = `
    ${S.banner ? `<div class="banner">${esc(S.banner.text)}</div>` : ""}
    <div class="card win">
      <span class="label">Game over · ${S.round} round${S.round === 1 ? "" : "s"}</span>
      <h2>${head}</h2>
    </div>
    <div class="stack">
      <button class="btn primary" id="again">Play again</button>
      <button class="btn plain" id="new">Change players or difficulty</button>
    </div>`;
  document.getElementById("again").addEventListener("click", startGame);
  document.getElementById("new").addEventListener("click", () => { S.phase = "setup"; render(); });
}

function render() {
  confirmEnd = false;
  ({ setup: renderSetup, turn: renderTurn, over: renderOver })[S.phase]();
  window.scrollTo(0, 0);
}

function start(data) { if (data && data.S && data.S.order) S = data.S; render(); }
window.claude?.hot?.snapshot?.(() => ({ S }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
